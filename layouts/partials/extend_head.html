<!-- Custom CSS for wider content area -->
<style>
    .main {
        max-width: 960px !important;
    }
    .post-content {
        max-width: 100% !important;
    }
    article {
        max-width: 100% !important;
    }
    
    /* Mermaid diagram visibility in both light and dark modes */
    .mermaid {
        background-color: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
    }
    
    /* Dark mode adjustments */
    .dark .mermaid {
        background-color: #2d2d2d;
        border-color: #444;
    }
</style>

{{ if or .Params.mermaid .Site.Params.mermaid (.Page.Store.Get "hasMermaid") }}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  // Detect theme and set Mermaid theme accordingly
  const isDark = document.body.classList.contains('dark') || 
                 window.matchMedia('(prefers-color-scheme: dark)').matches;
  
  mermaid.initialize({ 
    startOnLoad: true,
    theme: isDark ? 'dark' : 'neutral'
  });
  
  // Re-initialize when theme changes
  const observer = new MutationObserver(() => {
    const isDarkNow = document.body.classList.contains('dark');
    mermaid.initialize({ 
      startOnLoad: true,
      theme: isDarkNow ? 'dark' : 'neutral'
    });
    // Re-render existing diagrams
    document.querySelectorAll('.mermaid').forEach(el => {
      const content = el.getAttribute('data-processed') ? el.textContent : el.innerHTML;
      el.removeAttribute('data-processed');
      el.innerHTML = content;
    });
    mermaid.run();
  });
  
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
</script>
{{ end }}
