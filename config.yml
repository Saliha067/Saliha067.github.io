# ========================================
# ===== CUSTOMIZE: Your Personal Info =====
# ========================================
# Update these values with your own information
baseURL: https://Saliha067.github.io/  # Your GitHub Pages URL
languageCode: en-us
title: spf-in-action  # Your blog title
theme: 'PaperMod'
pagination.pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: G-J1C59DSSF4  # Uncomment and add your Google Analytics ID if needed
minify:
  disableXML: true
  minifyOutput: true

taxonomies:
  # category: categories
  tag: tags

related:
  includeNewer: true
  indices:
  # - name: categories
  #   weight: 40
  - name: tags
    weight: 60
  threshold: 90
  toLower: false

# ===== CUSTOMIZE: Site Parameters =====
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: spf-in-action  # Your name or blog title
  description: "Platform Engineering Manager & AI Practitioner | Building intelligent, scalable systems"  
  keywords: [Kubernetes, Kafka, OpenSearch, Terraform, AWS, Docker, Ansible, DevOps, Platform Engineering, AI, Cloud Native, Automation]  # Keywords for SEO
  author: Saliha  # Your name
  # author: ["Me", "You"] # multiple authors
  images: ["/images/profile.jpg"]  # Default image for social sharing
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons: ["x", "linkedin", "whatsapp", "reddit"]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false
  searchHidden: false

  # ===== TODO: Replace with your own favicon files =====
  # Generate favicons at https://favicon.io or https://realfavicongenerator.net
  assets:
    disableHLJS: false # to disable highlight.js
    disableFingerprinting: false
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/android-chrome-512x512.png"

  # ===== CUSTOMIZE: Site Label =====
  label:
    text: "spf-in-action"  # Text shown in header
    # icon: /images/apple-touch-icon.png
    # iconHeight: 24

  # ===== CUSTOMIZE: Profile Mode (Optional - Currently Disabled) =====
  # Enable this if you want a profile-style homepage instead of blog list
  profileMode:
    enabled: false # Set to true to enable profile mode
    title: spf-in-action  # Your name
    subtitle: >
      I build stuff that scales. Here's how, why, and what went wrong along the way.
    imageUrl: "/images/profile.jpg"  # Add your profile image to static/images/
    imageWidth: 120
    imageHeight: 120
    imageTitle: Profile Photo
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # ===== CUSTOMIZE: Home Page Info =====
  homeInfoParams:
    Title: "Hey there 👋 Welcome!"  # Greeting on homepage
    Content: |
      I build stuff that scales. Here's how, why, and what went wrong along the way.
      &#13;&#10;
      Feel free to explore my posts, projects, and get in touch!
      
  # ===== CUSTOMIZE: Social Media Links =====
  # Remove or add social icons as needed
  # socialIcons:
    # - name: github
    #   url: "https://github.com/Saliha067"  # Your GitHub profile
    # - name: linkedin
      # url: "https://www.linkedin.com/in/spf-in-action1/"  # Your LinkedIn profile
    # - name: medium
    #   url: "https://yourmedium.medium.com/"  # Your Medium profile (optional)
    # - name: twitter
    #   url: "https://twitter.com/yourusername"  # Your Twitter/X profile (optional)

  # ===== CUSTOMIZE: Site Verification (Optional) =====
  # Add your site verification tags if needed
  # analytics:
  #   google:
  #     SiteVerificationTag: "your-tag"
  #   bing:
  #     SiteVerificationTag: "your-tag"
  #   yandex:
  #     SiteVerificationTag: "your-tag"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # ===== CUSTOMIZE: Edit Post Link =====
  editPost:
    URL: "https://github.com/Saliha067/Saliha067.github.io/blob/master/content"  # Your repo URL
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    # - identifier: categories
    #   name: Categories
    #   url: /categories/
    #   weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: srcery

outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary
